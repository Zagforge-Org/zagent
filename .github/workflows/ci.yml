name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig
        id: zig
        uses: actions/cache@v4
        with:
          path: zig
          key: zig-0.16.0-linux-x86_64

      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          mv zig-x86_64-linux-0.16.0 zig

      - name: Add Zig to PATH
        run: echo "$PWD/zig" >> "$GITHUB_PATH"

      - name: Format check
        run: zig fmt --check src build.zig build.zig.zon

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all
